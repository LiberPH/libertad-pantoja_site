<header class="site-header">
  <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Inicio">
    <img class="brand-fugu" src="{{ '/assets/img/marca/fugu.png' | relative_url }}" alt="" width="40" height="40">
    <span>Libertad Pantoja</span>
  </a>

  <nav class="site-nav" aria-label="Navegación principal">
    {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
