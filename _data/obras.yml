  alt: "Retrato en tinta china de una mujer mayor que sonríe, con el rostro surcado de arrugas y el cabello blanco."
  category: "original"
  year: "2012"
  technique: "Tinta china sobre papel"
  dimensions: "28 × 22.5 cm aprox."
  edition: "Pieza única"
  status: "disponible"
  price: "$4,000 MXN · 200 USD"
  framing: "Enmarcada"
  image: "/assets/img/obra/la-sonrisa-en-las-arrugas.jpg"
  image_width: 1037
  image_height: 1200
  description: >-
    Una de mis primeras piezas en tinta. Fue pensada como un ejercicio tanto de
    la técnica como de acercarse a la vejez y a la conciencia del paso del
    tiempo. Se entrega enmarcada en pino con vidrio: el vidrio la protege.

- title: "La luz de los insectos"
  alt: "Dibujo en grafito: una figura infantil de pie entre dos niñas sentadas, rodeadas de plantas y árboles luminosos, con el esqueleto de una tortuga a sus pies."
  category: "edicion-limitada"
  subtitle: "Original no disponible · edición limitada de impresiones"
  year: "2012–2026"
  technique: "Grafito sobre papel ilustración"
  dimensions: "36.5 × 25.5 cm"
  edition: "Edición limitada de 15 ejemplares, firmada y numerada"
  status: "disponible"
  price: "$3,000 MXN · 150 USD"
  price_framed: "$4,500 MXN · 225 USD"
  image: "/assets/img/obra/La_luz_de_los_insectos.jpeg"
  image_width: 1100
  image_height: 734
  featured: true
  description: >-
    El daimon de este dibujo está inspirado en un personaje de una novela que
    estoy escribiendo: una suerte de espíritu guía de una chica que camina por
    la Ciudad de México buscando su destino. Las dos niñas que lo acompañan no
    pertenecen a la novela; surgieron de un juego aparte, al imaginar a los tres
    como una representación del tiempo: lo racional, lo espiritual y lo
    instintivo. Los he dibujado durante años en bocetos y servilletas. Esta hoja
    la empecé en 2012 y la concluí catorce años después. La obra original no
    está en venta; se ofrece una edición limitada de quince impresiones,
    firmadas y numeradas.

