  featured: false
  teaser: "Una flor blanca, serena, que encontré también en Piedmont Park. Sus manchas rojizas, color frambuesa, recuerdan a la sangre…"
  description: >-
    Una flor blanca, serena, que encontré también en Piedmont Park. Sus
    manchas rojizas, color frambuesa, recuerdan a la sangre, a ese anhelo de
    la carne que existe en las criaturas celestiales. Lo blanco, en
    contraste con el fondo oscuro en medio del bosque, nos recuerda que en
    nuestros momentos más oscuros, en nuestras instancias más carnales, ahí
    está el espíritu que nos anima. La invitación es a considerar que en
    cada flor se encarna por un instante un ángel que vemos, o no, al pasar
    por un parque. Como dato curioso, usé esta imagen como portada de mi
    primer fanzine, El ángel Hertebiuse.

