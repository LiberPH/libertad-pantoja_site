- title: "Planta carnívora"
  category: "original"
  year: "2012"
  technique: "Tinta china sobre papel"
  dimensions: "26 × 22 cm"
  edition: "Pieza única"
  status: "disponible"
  price: "$7,500 MXN · 375 USD"
  framing: "Enmarcada"
  image: "/assets/img/obra/Planta_carnivora.jpeg"
  featured: true
  description: >-
    Tuve una temporada de fijación con las serpientes y los animales híbridos.
    Me pareció interesante pensar en una planta-animal, flor-serpiente, capaz
    de comer animales más pequeños que ella. La realicé poco después de tomar
    un curso de dibujo en tinta china. Mi primer dibujo fue un rostro copiado
    de una fotografía, pero quería lograr algo más mío, acorde con mis
    obsesiones biológicas.

- title: "Lo que dejé secar sobre la alfombra"
  story_label: "Leer el sueño"
  category: "original"
  year: "2026"
  technique: "Óleo sobre tela"
  dimensions: "35 × 45 cm"
  edition: "Pieza única"
  status: "disponible"
  price: "$14,000 MXN · 700 USD"
  framing: "Sin marco"
  image: "/assets/img/obra/lo-que-deje-secar.jpg"
  featured: true
  description: >-
    Soñé que visitaba a mi abuela. Al entrar en la casa de mi infancia
    encontraba a un hombre desnudo en una tina al que yo debía lavarle los pies.
    Cuando me negué, el lugar se llenó de cucarachas y los camarones del suelo
    fueron invadidos por ellas: era claro que, de no lavárselos, nos
    infestaríamos. El sueño sigue. De él salió también un cuento. Fue esta
    imagen la que me invitó a pintarla, quizá por la rareza de sus elementos.
    Coloqué camarones secos sobre la alfombra de mi casa, conseguí una cucaracha
    de plástico y me fotografié los pies. Usé esa foto como referencia para la
    pintura. Aún no acabo de descifrarla. De momento pienso que los camarones
    son las ideas que uno deja secar sobre la alfombra, y las cucarachas, lo que
    ocurre cuando se abandonan. Pintada en el taller de proyectos pictóricos de
    Darío Salzman.

- title: "El rescate del gato blanco"
  story_label: "Leer el sueño"
  category: "original"
  year: "2026"
  technique: "Gis pastel sobre papel negro"
  dimensions: "20.3 × 28 cm"
  edition: "Pieza única"
  status: "disponible"
  price: "$9,000 MXN · 450 USD"
  framing: "Enmarcada"
  image: "/assets/img/obra/el-rescate-del-gato-blanco.jpg"
  featured: true
  description: >-
    Una noche soñé que iba por la calle en Cuernavaca con mi pareja. Él
    rescataba un gato blanco del ataque de unos perros. El gato hablaba,
    agradecía en la lengua de los humanos antes de ser depositado en los brazos
    de una muchacha que andaba por el terreno baldío donde lo hallamos. Había
    también una navaja que refulgía con la luz anaranjada de una brasa y
    autopistas como hoyos de gusano. Decidí dibujar esta escena por la ternura
    que me evocaba y por ese recuerdo transfigurado de un lugar donde viví más
    de cinco años: el sueño me devolvió Cuernavaca deformada. Quise redescubrir
    el uso del gis pastel, una herramienta cálida y expresiva, dibujando una de
    las imágenes de este sueño. No sé si el mundo onírico es una puerta al
    inframundo o la entrada a nosotros mismos.

- title: "El fruto de la hojarasca"
  category: "original"
  year: "2026"
  technique: "Lápiz de color sobre papel Strathmore Toned Tan"
  dimensions: "19.5 × 20 cm"
  edition: "Pieza única"
  status: "disponible"
  price: "$8,500 MXN · 425 USD"
  framing: "Enmarcada"
  image: "/assets/img/obra/el-fruto-de-la-hojarasca.jpg"
  featured: true
  description: >-
    Al caminar por un parque, las cerezas de Jerusalén deslumbran como un fruto
    de la hojarasca. El contraste con sus hojas, de un verde cada vez más
    luminoso, nos hace sentir en un sueño. Vamos por un bosque frondoso donde en
    cualquier momento saldrán lobos y venados a nuestro encuentro. Podríamos
    pensar que la cereza es un jitomate o una ciruela, pero es un fruto
    venenoso. Nos lo demuestra su postura, turgente, presta a atacar. Es una
    criatura esperando propagarse, que la llevemos con nosotros a terrenos
    insospechados. Quise transmitir esa energía a través del color, invitar al
    espectador a ese bosque de ensueño que bien puede brindarle una tarde
    apacible o un escenario de pesadilla.

- title: "La luz de los insectos"
  category: "edicion-limitada"
  subtitle: "Original no disponible · edición limitada de impresiones"
  year: "2012–2026"
  technique: "Grafito sobre papel ilustración"
  dimensions: "36.5 × 25.5 cm"
  edition: "Edición limitada de 15 ejemplares, firmada y numerada"
  status: "disponible"
  price: "$3,000 MXN · 150 USD"
  price_framed: "$4,500 MXN · 225 USD"
  image: "/assets/img/obra/La_luz_de_los_insectos.jpeg"
  featured: true
  description: >-
    El daimon de este dibujo está inspirado en un personaje de una novela que
    estoy escribiendo: una suerte de espíritu guía de una chica que camina por
    la Ciudad de México buscando su destino. Las dos niñas que lo acompañan no
    pertenecen a la novela; surgieron de un juego aparte, al imaginar a los tres
    como una representación del tiempo: lo racional, lo espiritual y lo
    instintivo. Los he dibujado durante años en bocetos y servilletas. Esta hoja
    la empecé en 2012 y la concluí catorce años después. La obra original no
    está en venta; se ofrece una edición limitada de quince impresiones,
    firmadas y numeradas.

