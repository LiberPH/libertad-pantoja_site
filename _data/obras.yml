  alt: "Fotografía de cerca de una flor anaranjada de pétalos rizados con una larva clara en el centro, sobre un fondo verde oscuro desenfocado."
  category: "fotografia"
  subtitle: "Serie «Hadas urbanas»"
  year: "2026"
  technique: "Fotografía digital"
  dimensions: "22.2 × 15.7 cm (imagen) · impresión de pigmento sobre papel de algodón"
  edition: "Edición limitada de 10 ejemplares, firmada y numerada"
  status: "disponible"
  price: "$3,000 MXN · 150 USD"
  price_framed: "$4,500 MXN · 225 USD"
  image: "/assets/img/obra/el-reino-del-sol.jpg"
  image_width: 1200
  image_height: 847
  featured: true
  description: >-
    Descubrí esta imagen caminando por el parque Tezozómoc, en Azcapotzalco.
    Iba con la intención de capturar imágenes para la serie «Hadas urbanas» y la
    calidez de los colores otoñales me invitó a tomar la fotografía: en el resto
    de las tomas de ese día dominan los verdes. La larva de color claro en el
    centro de la flor me hizo sentir una cierta dulzura atalcada, principesca.

