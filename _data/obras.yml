  featured: true
  description: >-
    Descubrí esta imagen caminando por el parque Tezozómoc, en Azcapotzalco.
    Iba con la intención de capturar imágenes para la serie «Hadas urbanas» y la
    calidez de los colores otoñales me invitó a tomar la fotografía: en el resto
